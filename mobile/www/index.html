<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <title>garden</title>
    <style>
      :root {
        color-scheme: light;
        --teal: #0d9488;
        --bg: #f8fafc;
        --text: #0f172a;
        --muted: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #ccfbf1, var(--bg) 55%);
        color: var(--text);
        text-align: center;
      }
      .mark {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: var(--teal);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 2.4rem;
        font-weight: 800;
        margin: 0 auto 1rem;
        box-shadow: 0 16px 40px rgba(13, 148, 136, 0.28);
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.7rem;
      }
      p {
        margin: 0 auto 1.25rem;
        max-width: 28rem;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.2rem;
        border-radius: 999px;
        background: var(--teal);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">G</div>
      <h1>garden</h1>
      <p>
        Native shell is ready. Set <code>GARDEN_APP_URL</code> to your live HTTPS site, then run
        <code>npm run mobile:sync</code> so Android and iOS open the real shop.
      </p>
      <a href="http://127.0.0.1:3780/shop">Open local shop</a>
    </main>
  </body>
</html>
