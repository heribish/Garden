# Render blueprint — connect this repo in Render Dashboard → New → Blueprint
services:
  - type: web
    name: garden
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate:commerce
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3780
      - key: ENABLE_DEV_TOOLS
        value: "0"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ADMIN_EMAILS
        sync: false
      - key: PGSSL
        value: "1"
      # Keep mock wallet flows off in any public deployment. Set to "1" only
      # after replacing the mock adapter with a contracted payment provider.
      - key: WALLET_PAYMENTS_ENABLED
        value: "0"
      - key: SESSION_TTL_MS
        value: "2592000000"
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: API_RATE_LIMIT_MAX
        value: "120"
